<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card source</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@200..500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Values copied from src/styles/instrument.css. The card is the front
         page: black ground, the plate, the mark, one line of mono. */
      :root {
        --bg: #000;
        --fg1: #ffffeb;
        --fg3: #93938a;
        --signal: #d6a4ff;
        --mono: 'Martian Mono', ui-monospace, Menlo, monospace;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; }

      body {
        position: relative;
        background: var(--bg);
        color: var(--fg1);
        font-family: var(--mono);
        overflow: hidden;
      }

      /* THE PLATE, framed as the desktop front page frames it: peak a little
         right of centre and high, the north face filling the right half, the
         left slope entering low. Sky in the file is #000, so no mask. The
         numbers place the summit (57.6 %, 14.1 % of the image) at (800, 118),
         which keeps the north face's left shoulder clear of the wordmark. */
      .plate {
        position: absolute;
        width: 1320px;
        height: auto;
        left: 40px;
        top: 13px;
      }

      .mark {
        position: absolute;
        left: 72px;
        top: 60px;
        height: 40px;
        width: auto;
        color: var(--fg1);
      }

      .stack {
        position: absolute;
        left: 72px;
        top: 244px;
      }

      /* Lowercase, light, tracked — the menu's voice, one size up. */
      .display {
        font-weight: 300;
        font-size: 60px;
        line-height: 1.1;
        letter-spacing: 0.01em;
      }
      .display .line { display: block; }
      .display .em { font-style: italic; color: var(--signal); }

      .label {
        margin-top: 30px;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      /* The blinking block from the site, held on. */
      .label::after {
        content: '';
        display: inline-block;
        width: 0.55em;
        height: 0.95em;
        margin-left: 0.7em;
        vertical-align: -0.12em;
        background: var(--signal);
      }
    </style>
  </head>
  <body>
    <img class="plate" src="../public/hero/matterhorn-still.webp" alt="" />

    <!-- The real AMB monogram, inlined from src/components/brand/AmbMark.astro -->
    <svg class="mark" viewBox="0 0 360 220" fill="none" aria-label="AMB" role="img">
      <g stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 184 V70 Q60 38 90 38" />
        <path d="M60 114 H85 C100 114 109 110 114 99" />
        <path d="M124 184 V38 L172 116 L220 38 V184" />
        <path d="M252 184 V38" />
        <path d="M252 38 H285 C315 38 328 55 328 78 C328 102 314 114 284 114 H252" />
        <path d="M252 114 H286 C318 114 332 130 332 150 C332 173 318 184 286 184 H252" />
      </g>
    </svg>

    <div class="stack">
      <h1 class="display">
        <span class="line">alex monkey</span>
        <span class="line">business<span class="em">.</span></span>
      </h1>
      <p class="label" id="label">ALEXANDER SAMNØY · BUILDER</p>
    </div>
  </body>
</html>
