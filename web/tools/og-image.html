<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card source</title>
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Values copied from src/styles/tokens.css. Dark is the site's default,
         so the card wears the velvet canvas. */
      :root {
        --velvet: #121211;
        --cream: #ffffeb;
        --fog: #93938a;
        --lavender: #f0d7ff;
        --serif: 'EB Garamond', Georgia, serif;
        --sans: 'Figtree', -apple-system, system-ui, sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; }

      body {
        background: var(--velvet);
        color: var(--cream);
        font-family: var(--sans);
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      /* align-self is load-bearing: as a stretched column flex item the svg box
         goes full width and preserveAspectRatio then centres the artwork in it. */
      .mark {
        align-self: flex-start;
        height: 44px;
        width: auto;
        display: block;
        color: var(--cream);
      }

      /* Display and lede read as one block; only the mark sits apart. */
      .stack { display: flex; flex-direction: column; gap: 44px; }

      .display {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 116px;
        line-height: 0.85;
        letter-spacing: -0.03em;
      }
      .display .line { display: block; }
      .display .dim { color: var(--fog); }
      .display .period { color: var(--lavender); }

      /* Same hand-drawn underline as the live hero */
      .squiggle { position: relative; display: inline-block; }
      .squiggle svg {
        position: absolute;
        left: 0; right: 0; bottom: -0.17em;
        width: 100%; height: 0.18em;
        overflow: visible;
      }
      .squiggle svg path {
        fill: none;
        stroke: var(--lavender);
        stroke-width: 4;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      .lede {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 25px;
        line-height: 1.3;
        color: var(--fog);
        white-space: pre-line;  /* the copy breaks itself — see LEDE below */
      }
    </style>
  </head>
  <body>
    <!-- The real AMB monogram, inlined from src/components/brand/AmbMark.astro -->
    <svg class="mark" viewBox="0 0 360 220" fill="none" aria-label="AMB" role="img">
      <g stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 184 V70 Q60 38 90 38" />
        <path d="M60 114 H85 C100 114 109 110 114 99" />
        <path d="M124 184 V38 L172 116 L220 38 V184" />
        <path d="M252 184 V38" />
        <path d="M252 38 H285 C315 38 328 55 328 78 C328 102 314 114 284 114 H252" />
        <path d="M252 114 H286 C318 114 332 130 332 150 C332 173 318 184 286 184 H252" />
      </g>
    </svg>

    <div class="stack">
      <h1 class="display">
      <span class="line dim">Alex</span>
      <span class="line"
        ><span class="squiggle"
          >Monkey business<span class="period">.</span><svg
            viewBox="0 0 300 12"
            preserveAspectRatio="none"
            aria-hidden="true"
          ><path d="M2 8C40 2 58 11 98 5.5S158 2 198 7.5S262 10.5 298 4" /></svg
        ></span></span
        >
      </h1>

      <p class="lede" id="lede">Small things. Big plans. And a couple that actually got finished.</p>
    </div>
    <script>
    // The card is rendered twice, once per language. Only the lede differs —
    // "Alex Monkey business." is the brand and stays put. The newline is the
    // same break the site makes: the punchline gets its own line.
    const LEDE = {
      nb: 'Små ting. Store planer.\nOg et par ting som faktisk ble ferdige.',
      en: 'Small things. Big plans.\nAnd a couple that actually got finished.',
    };
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    document.getElementById('lede').textContent = LEDE[lang] || LEDE.en;
  </script>
</body>
</html>
